# LitBeacon: local browser workspace; state is stored on the host.
x-litbeacon-common: &litbeacon-common
  build:
    context: .
  image: litbeacon:local
  working_dir: /app
  env_file:
    - .env
  volumes:
    - ./data:/app/data
    - ./reports:/app/reports
    - ./logs:/app/logs
    - ./log:/app/log
  init: true

services:
  web:
    <<: *litbeacon-common
    command: ["sh", "/app/docker/boot.sh", "web"]
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Opt-in. Stop any Windows bot listener using the same Telegram token first.
  telegram:
    <<: *litbeacon-common
    profiles: ["bot"]
    command: ["sh", "/app/docker/boot.sh", "telegram"]
    restart: unless-stopped
