name: Windows workspace smoke

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-workspace:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies (no embedding model download)
        run: python -m pip install -r requirements-dev.txt -r requirements-web.txt -r requirements-annotations.txt -r requirements-browser-tests.txt
      - name: Inbox, clusters and mixed-provider graph API workflows
        run: python -m pytest -q tests/test_workspace_workflow_smoke.py tests/test_citation_mixed_providers.py tests/test_workspace_web.py tests/test_workspace_v08.py
      - name: Install pinned DOM test dependencies
        run: npm ci --prefix tests/web --ignore-scripts
      - name: Browser-script DOM workflows and graph regression tests
        run: npm test --prefix tests/web
      - name: Native Chrome inbox, clusters, graph click/drag/zoom (sandbox enabled)
        id: browser
        run: python -m scripts.windows_browser_smoke
      - name: Synthetic browser screenshots
        if: always() && steps.browser.outputs.artifact_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-workspace-screenshots
          path: ${{ steps.browser.outputs.artifact_dir }}/*.png
          if-no-files-found: warn
          retention-days: 7
