name: Windows workspace smoke

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-workspace:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated PowerShell scheduler error and lifecycle contracts
        shell: powershell
        run: .\scripts\windows_scheduler_smoke.ps1
      - name: Hosted Windows native scheduler lifecycle (unique disposable tasks only)
        shell: powershell
        run: .\scripts\windows_scheduler_native_smoke.ps1
      - name: Install test dependencies (no embedding model download)
        run: python -m pip install -r requirements-dev.txt -r requirements-web.txt -r requirements-annotations.txt -r requirements-browser-tests.txt -r requirements-ui.txt
      - name: Inbox, clusters and mixed-provider graph API workflows
        run: python -m pytest -q tests/test_workspace_workflow_smoke.py tests/test_citation_mixed_providers.py tests/test_workspace_web.py tests/test_workspace_v08.py tests/test_research_api.py tests/test_research_files.py tests/test_venue_presets.py tests/test_cli_research_bundles.py
      - name: Telegram listener conflicts and safe diagnostics (fake credentials only)
        run: python -m pytest -q -ra tests/test_telegram_bot.py tests/test_telegram_diagnostics.py tests/test_telegram_listener_cli.py tests/test_schedule_management.py
      - name: Provider failure integrity and shared log paths (synthetic only)
        run: python -m pytest -q -ra tests/test_provider_failure_integrity.py tests/test_log_paths.py tests/test_user_bundle.py
      - name: Telegram shutdown and scheduler interface regressions
        run: python -m pytest -q -ra tests/test_telegram_shutdown.py tests/test_scheduler_lifecycle.py tests/test_scheduler_interfaces.py
      - name: Synthetic local backup, new-destination restore and legacy upgrade
        run: python -m pytest -q -ra tests/test_library_recovery.py tests/test_migration.py
      - name: Install pinned DOM test dependencies
        run: npm ci --prefix tests/web --ignore-scripts
      - name: Browser-script DOM workflows and graph regression tests
        run: npm test --prefix tests/web
      - name: Native Chrome inbox, clusters, graph click/drag/zoom (sandbox enabled)
        id: browser
        run: python -m scripts.windows_browser_smoke
      - name: Synthetic browser screenshots
        if: always() && steps.browser.outputs.artifact_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-workspace-screenshots
          path: ${{ steps.browser.outputs.artifact_dir }}/*.png
          if-no-files-found: warn
          retention-days: 7
