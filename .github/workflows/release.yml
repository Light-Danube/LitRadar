name: Attach wheel and lightweight setup to GitHub Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build runtime wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Build version-checked setup archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m scripts.build_user_bundle dist/*.whl --output-dir dist --tag "$RELEASE_TAG"
      - name: Verify extracted setup before attachment
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile
          from zipfile import ZipFile
          root = pathlib.Path.cwd()
          with tempfile.TemporaryDirectory(prefix='litbeacon-release-') as temporary:
              extracted = pathlib.Path(temporary).resolve()
              wheel = next((root / 'dist').glob('*.whl'))
              with ZipFile(next((root / 'dist').glob('*-setup.zip'))) as archive:
                  assert set(archive.namelist()) == {wheel.name, 'SETUP.txt'}
                  assert archive.read(wheel.name) == wheel.read_bytes()
                  archive.extractall(extracted)
              environment = extracted / '.venv'
              subprocess.run([sys.executable, '-m', 'venv', str(environment)], check=True)
              interpreter = environment / 'bin' / 'python'
              subprocess.run([str(interpreter), '-m', 'pip', 'install', f'{extracted / wheel.name}[web]', 'httpx'], cwd=extracted, check=True)
              subprocess.run([str(interpreter), str(root / 'scripts' / 'built_wheel_smoke.py')], cwd=extracted, check=True)
      - name: Attach verified runtime artifacts to the existing release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*-setup.zip
