[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litradar"
version = "0.5.3"
description = "Personal literature radar and research inbox"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0,<6"]
ui = ["textual>=0.50,<2"]
llm = ["openai>=1.0,<3", "anthropic>=0.30,<1"]

[tool.setuptools]
py-modules = ["cli", "bibliography", "offline", "ui", "pipeline", "notes"]
packages = ["ranking", "sources", "storage", "llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
