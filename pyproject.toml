[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litradar"
version = "0.4.2"
description = "Personal literature radar and research inbox"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools]
py-modules = ["cli", "bibliography", "offline", "ui"]
packages = ["ranking", "sources", "storage", "llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
